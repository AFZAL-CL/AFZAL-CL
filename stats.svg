<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect width="840" height="880" rx="12" fill="#0d1117"/><rect x="0.5" y="0.5" width="839" height="879" rx="12" fill="none" stroke="#30363d"/><line x1="0" y1="30" x2="840" y2="30" stroke="#30363d"/><circle cx="20" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="52" cy="15" r="5" fill="#27c93f"/><text x="420" y="19" fill="#7d8590" font-size="12" text-anchor="middle">afzal@github: ~$ ./stats.sh</text><rect x="20" y="50" width="392" height="150" rx="10" fill="#161b22" stroke="#30363d"/><text x="44" y="90" fill="#7d8590" font-size="22">$ current streak</text><text x="44" y="150" fill="#39d353" font-size="48" font-weight="700">LIVE</text><text x="44" y="182" fill="#7d8590" font-size="18">syncs on first workflow run</text><rect x="432" y="50" width="392" height="150" rx="10" fill="#161b22" stroke="#30363d"/><text x="456" y="90" fill="#7d8590" font-size="22">$ longest streak</text><text x="456" y="150" fill="#39d353" font-size="48" font-weight="700">LIVE</text><text x="456" y="182" fill="#7d8590" font-size="18">syncs on first workflow run</text><rect x="20" y="216" width="392" height="150" rx="10" fill="#161b22" stroke="#30363d"/><text x="44" y="256" fill="#7d8590" font-size="22">$ contributions</text><text x="44" y="316" fill="#39d353" font-size="48" font-weight="700">125</text><text x="44" y="348" fill="#7d8590" font-size="18">syncs on first workflow run</text><rect x="432" y="216" width="392" height="150" rx="10" fill="#161b22" stroke="#30363d"/><text x="456" y="256" fill="#7d8590" font-size="22">$ active days</text><text x="456" y="316" fill="#39d353" font-size="48" font-weight="700">LIVE</text><text x="456" y="348" fill="#7d8590" font-size="18">syncs on first workflow run</text><rect x="20" y="382" width="392" height="150" rx="10" fill="#161b22" stroke="#30363d"/><text x="44" y="422" fill="#7d8590" font-size="22">$ best day</text><text x="44" y="482" fill="#39d353" font-size="48" font-weight="700">LIVE</text><text x="44" y="514" fill="#7d8590" font-size="18">syncs on first workflow run</text><rect x="432" y="382" width="392" height="150" rx="10" fill="#161b22" stroke="#30363d"/><text x="456" y="422" fill="#7d8590" font-size="22">$ avg / active day</text><text x="456" y="482" fill="#39d353" font-size="48" font-weight="700">LIVE</text><text x="456" y="514" fill="#7d8590" font-size="18">syncs on first workflow run</text><rect x="20" y="565" width="800" height="285" rx="10" fill="#161b22" stroke="#30363d"/><text x="44" y="605" fill="#7d8590" font-size="22">$ contributions / month</text><text x="44" y="650" fill="#e6edf3" font-size="18">Live monthly totals will appear here after the first GitHub Actions sync.</text><text x="44" y="690" fill="#7d8590" font-size="16">The checked-in bootstrap uses the verified 125-contribution total only;</text><text x="44" y="716" fill="#7d8590" font-size="16">it does not invent per-day statistics.</text></svg>